<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeuroForge</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b0d12;color:#eef1f7;height:100vh;display:flex}aside{width:260px;background:#11141b;border-right:1px solid #252a35;padding:22px;display:flex;flex-direction:column}h1{font-size:22px;margin:0 0 5px}.sub{color:#8e97a8;font-size:13px;margin-bottom:25px}.status{padding:10px 12px;border:1px solid #29303d;border-radius:10px;background:#171b23;font-size:13px;margin-bottom:20px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#52d273;margin-right:7px}.emotion{border:1px solid #29303d;border-radius:12px;padding:14px;margin-top:auto}.emotion b{display:block;font-size:18px;margin:4px 0 12px}.bar{height:5px;background:#252a35;border-radius:5px;margin:5px 0 10px;overflow:hidden}.fill{height:100%;background:#7c8cff;border-radius:5px}main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:65px;border-bottom:1px solid #252a35;padding:0 28px;display:flex;align-items:center;font-weight:600}.messages{flex:1;overflow:auto;padding:35px max(20px,calc((100% - 850px)/2));}.msg{max-width:800px;margin:0 auto 22px;padding:16px 18px;border-radius:14px;line-height:1.55;white-space:pre-wrap}.user{background:#1a1f29}.ai{background:#12161d;border:1px solid #252a35}.label{font-size:11px;color:#8791a3;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}.composer{border-top:1px solid #252a35;padding:18px max(20px,calc((100% - 850px)/2));display:flex;gap:10px}textarea{flex:1;resize:none;background:#171b23;border:1px solid #303746;color:#fff;border-radius:12px;padding:13px;font:inherit;height:50px;outline:none}button{border:0;border-radius:12px;padding:0 20px;background:#7c8cff;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}@media(max-width:700px){aside{display:none}}
</style>
</head>
<body>
<aside><h1>NeuroForge</h1><div class="sub">Stateful programming AI</div><div class="status"><span class="dot"></span><span id="status">Connecting...</span></div><div class="emotion"><div class="label">Current state</div><b id="emotion">curious</b><div>Curiosity<div class="bar"><div class="fill" id="curiosity"></div></div></div><div>Confidence<div class="bar"><div class="fill" id="confidence"></div></div></div><div>Frustration<div class="bar"><div class="fill" id="frustration"></div></div></div><div>Boredom<div class="bar"><div class="fill" id="boredom"></div></div></div></div></aside>
<main><div class="top">NeuroForge Chat</div><div class="messages" id="messages"><div class="msg ai"><div class="label">NeuroForge</div>Hello! I'm NeuroForge. My simulated emotional state and memory are active. Ask me about programming or anything you're building.</div></div><form class="composer" id="form"><textarea id="input" placeholder="Message NeuroForge..." required></textarea><button id="send">Send</button></form></main>
<script>
const messages=document.getElementById('messages'),input=document.getElementById('input'),form=document.getElementById('form'),send=document.getElementById('send');
function setState(a,emotion){document.getElementById('emotion').textContent=emotion||'calm';for(const k of ['curiosity','confidence','frustration','boredom']){const e=document.getElementById(k);if(e)e.style.width=Math.max(0,Math.min(100,(a?.[k]||0)*100))+'%'}}
async function health(){try{const r=await fetch('/health');const d=await r.json();document.getElementById('status').textContent='Online';setState(d.affect,d.emotion)}catch(e){document.getElementById('status').textContent='Offline'}}
function add(text,type){const x=document.createElement('div');x.className='msg '+type;x.innerHTML='<div class="label">'+(type==='user'?'You':'NeuroForge')+'</div>'+text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));messages.appendChild(x);messages.scrollTop=messages.scrollHeight}
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';send.disabled=true;add(text,'user');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:'web'})});const d=await r.json();add(d.reply,'ai');setState(d.affect,d.emotion)}catch(err){add('API error: '+err.message,'ai')}send.disabled=false;input.focus()};
health();setInterval(health,5000);input.focus();
</script></body></html>
